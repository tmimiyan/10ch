<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="気軽に話せる、みんなの掲示板">
    <meta name="theme-color" content="#2563eb">
    <title>10ちゃんねる</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="10ちゃんねる ホーム">10ちゃんねる</a>
      <nav class="header-actions" aria-label="ヘッダーメニュー">
        <button class="icon-button theme-toggle" type="button" aria-label="テーマを切り替える">☾</button>
        <a class="button button-primary login-link" href="./login.html">ログイン</a>
        <button class="button button-ghost logout-button" type="button" hidden>ログアウト</button>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <p class="eyebrow">OPEN COMMUNITY</p>
        <h1>気軽に話せる、みんなの掲示板</h1>
        <p>興味のある話題を探したり、新しいスレッドを立てたりできます。</p>
      </section>

      <section class="panel" aria-labelledby="search-heading">
        <div class="section-heading">
          <h2 id="search-heading">スレッドを探す</h2>
        </div>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="search-input">スレッドタイトルを検索</label>
          <input id="search-input" name="search" type="search" maxlength="80" placeholder="タイトルで検索">
          <button class="button button-primary" type="submit">検索</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="create-heading">
        <div class="section-heading">
          <div>
            <h2 id="create-heading">新しいスレッド</h2>
            <p class="muted">作成には Google ログインが必要です。</p>
          </div>
        </div>
        <form id="thread-form" class="stack-form">
          <label for="thread-author">投稿者名 <span class="optional">（任意）</span></label>
          <input id="thread-author" name="authorName" type="text" maxlength="24" autocomplete="nickname" placeholder="未入力の場合は名無しさん">
          <label for="thread-title">タイトル</label>
          <input id="thread-title" name="title" type="text" maxlength="80" required placeholder="例：週末に観た映画を語ろう">
          <label for="thread-body">最初の投稿</label>
          <textarea id="thread-body" name="body" maxlength="2000" rows="5" placeholder="スレッドの内容を書いてください（画像のみでも投稿できます）"></textarea>
          <label for="thread-image">画像 <span class="optional">（任意・3枚まで、1枚5MBまで）</span></label>
          <input id="thread-image" name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
          <button id="create-thread-button" class="button button-primary" type="submit">スレッドを作成</button>
        </form>
      </section>

      <section aria-labelledby="threads-heading">
        <div class="section-heading threads-heading">
          <div>
            <h2 id="threads-heading">スレッド一覧</h2>
            <p id="thread-count" class="muted" aria-live="polite"></p>
          </div>
          <button id="clear-search" class="text-button" type="button" hidden>検索をクリア</button>
        </div>
        <div id="thread-list" class="thread-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="thread-card-template">
      <article class="thread-card">
        <a class="thread-card-link" href="#">
          <h3 class="thread-title"></h3>
          <p class="thread-preview"></p>
          <div class="thread-meta"><span class="thread-author"></span><span class="thread-date"></span><span class="thread-replies"></span></div>
        </a>
      </article>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
