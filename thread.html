<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OpenBBS - Thread</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css">

    <script
        type="module"
        src="assets/js/common.js"
        defer></script>

    <script
        type="module"
        src="assets/js/thread.js"
        defer></script>

</head>

<body>

<header class="header">

    <div class="logo">

        <h1>OpenBBS</h1>

        <span class="subtitle">
            GitHub Pages Bulletin Board
        </span>

    </div>

    <nav>

        <a href="index.html">
            ← 戻る
        </a>

        <button id="themeButton">
            🌙
        </button>

    </nav>

</header>

<main>

<section class="board">

    <h2 id="threadTitle">

        読み込み中...

    </h2>

    <div
        id="threadInfo"
        class="threadInfo">

    </div>

</section>

<section
    id="replyList"
    class="board">

    <div class="loading">

        読み込み中...

    </div>

</section>

<section class="board">

    <h2>レスを書く</h2>

    <form id="replyForm">

        <div class="formGroup">

            <label>

                名前

            </label>

            <input
                id="replyName"
                type="text"
                maxlength="32"
                placeholder="名無しさん">

        </div>

        <div class="formGroup">

            <label>

                メール

            </label>

            <input
                id="replyMail"
                type="text"
                maxlength="64"
                placeholder="sage">

        </div>

        <div class="formGroup">

            <label>

                本文

            </label>

            <textarea
                id="replyBody"
                rows="10"
                maxlength="4000"
                placeholder="本文を入力してください"></textarea>

        </div>

        <button
            id="submitReply"
            type="submit">

            書き込む

        </button>

    </form>

</section>

</main>

<footer>

    OpenBBS Version 0.2.0

</footer>

</body>

</html>
